<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    margin: 0;
    background: white;
    color: rgb(27, 132, 238);
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 120px;
    
}

/* 🔙 BACK BUTTON (TOP RIGHT) */
.back-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 14px;
    background: rgb(27, 132, 238);
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    font-size: 40px;
}

.back-btn:hover {
    background: rgb(27, 132, 238);
}

/* FORM BOX */
.form-box {
    display: inline-block;
    padding: 25px;
    border: 1px solid rgb(27, 132, 238);
    border-radius: 10px;
    font-size: 40px;
}

/* INPUT */
input {
    padding: 10px;
    width: 800px;
    margin-top: 10px;
    background: white;
    color: rgb(27, 132, 238);
    border: 2px solid rgb(27, 132, 238);
    font-size: 40px;
}

/* BUTTON */
button {
    margin-top: 15px;
    padding: 10px 20px;
    background: rgb(27, 132, 238);
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 40px;
}

button:hover {
    background: rgb(27, 132, 238);
    
}

/* LINK */
a {
    color: rgb(27, 132, 238);
    
}
</style>

</head>

<body>

<!-- 🔙 BACK -->
<a href="/" class="back-btn">⬅ Back</a>

<div class="form-box">
<h2>Login</h2>

<form method="POST">
<input type="text" name="username" placeholder="Username" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<button type="submit">Login</button>
</form>

<br>
<a href="/register">Create account</a>
</div>

</body>
</html>
